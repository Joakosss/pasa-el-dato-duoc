services:
  postgres:
    image: docker.io/postgres:16
    container_name: pasael-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "0.0.0.0:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro,z
      - ./postgres/02-seed.dev.sql:/docker-entrypoint-initdb.d/02-seed.dev.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - pasaelnetz

  mongo:
    image: docker.io/mongo:7
    container_name: pasael-mongo
    restart: unless-stopped
    ports:
      - "0.0.0.0:27017:27017"
    volumes:
      - mongodata:/data/db
      - ./mongo/init-dev.js:/docker-entrypoint-initdb.d/init-dev.js:ro,z
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping')\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pasaelnetz

  back:
    build:
      context: ./pasa-el-dato-back
      dockerfile: Dockerfile.dev
    container_name: pasael-back
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # main.ts lee API_PORT (con fallback a PORT). DATABASE_URL/MONGO_URL
      # quedan como reserva hasta que el back agregue clientes de DB.
      PORT: ${API_PORT}
      API_PORT: ${API_PORT}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MONGO_URL: mongodb://mongo:27017/${MONGO_DB}
    ports:
      - "0.0.0.0:${API_PORT}:${API_PORT}"
    volumes:
      - ./pasa-el-dato-back:/app:z
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    # Chequea la ventanilla real: GET /api/health con fetch de Node 22.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:'+(process.env.API_PORT||process.env.PORT||3001)+'/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - pasaelnetz

  front:
    build:
      context: ./pasa-el-dato-front
      dockerfile: Dockerfile.dev
    container_name: pasael-front
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
    ports:
      - "0.0.0.0:${FRONT_PORT}:3000"
    volumes:
      - ./pasa-el-dato-front:/app:z
      - /app/node_modules
      - /app/.next
    depends_on:
      - back
    networks:
      - pasaelnetz

volumes:
  pgdata:
  mongodata:

networks:
  pasaelnetz:
    driver: bridge
